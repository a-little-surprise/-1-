<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8eef3">
<title>雨の日、ふたりきり | ミニ恋愛ゲーム</title>
<style>
:root{--rose:#bd718f;--rose2:#e8b7ca;--ink:#3f3440;--muted:#8a7c86;--cream:#fffafc;--panel:#fff;--line:#eadce4}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#f8eef3,#f3f1f7 55%,#edf4f7);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:620px;margin:0 auto;padding:18px 14px 38px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.12em;margin:3px 2px 12px}
.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 36px rgba(94,63,84,.08);overflow:hidden}
.hero{height:230px;background:linear-gradient(180deg,rgba(32,36,57,.06),rgba(32,36,57,.3)),radial-gradient(circle at 70% 28%,#b8c8dc 0,#7789a5 22%,#59647e 48%,#33364f 100%);position:relative;display:flex;align-items:flex-end;padding:22px;color:white}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 18px,rgba(255,255,255,.15) 19px 20px,transparent 21px 42px);opacity:.5}
.hero:after{content:"";position:absolute;right:24px;top:22px;width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.14);filter:blur(1px)}
.heroText{position:relative;z-index:1}
.kicker{font-size:11px;letter-spacing:.2em;opacity:.8}
h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:500;font-size:30px;letter-spacing:.05em;margin:8px 0 4px}
.subtitle{font-size:12px;opacity:.85}
.content{padding:20px}
.storyLabel{font-size:11px;letter-spacing:.16em;color:var(--rose);margin-bottom:10px}
.story{white-space:pre-line;line-height:1.95;font-size:15px;min-height:160px}
.char{display:flex;gap:12px;align-items:center;padding:13px;background:#faf5f8;border:1px solid #f0e4eb;border-radius:15px;margin:0 0 17px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#d7dce8,#8c9bb3);display:grid;place-items:center;color:white;font-family:serif;font-size:21px;flex:none}
.charName{font-weight:700}
.charDesc{font-size:12px;color:var(--muted);margin-top:3px}
.choices{display:grid;gap:10px;margin-top:18px}
.choice{width:100%;border:1px solid #e5cad8;background:#fff;color:var(--ink);padding:14px 15px;border-radius:14px;text-align:left;font-size:14px;line-height:1.55;cursor:pointer;transition:.18s}
.choice:hover,.choice:focus{border-color:var(--rose);background:#fff6fa;transform:translateY(-1px)}
.btn{border:0;background:var(--rose);color:white;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:700;cursor:pointer;width:100%;box-shadow:0 5px 14px rgba(189,113,143,.2)}
.btn.secondary{background:#fff;color:var(--rose);border:1px solid #e5cad8;box-shadow:none}
.meter{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px;font-size:12px;color:var(--muted)}
.meterTrack{height:7px;background:#f0e5eb;border-radius:9px;overflow:hidden;flex:1;margin:0 9px}
.meterFill{height:100%;background:linear-gradient(90deg,#dba2bb,#bd718f);width:0;transition:width .3s}
.end{border-radius:16px;padding:18px;background:#fff3f8;border:1px solid #edcfdd}
.end h2{font-family:"Yu Mincho",serif;color:#a44e72;font-size:22px;margin:0 0 9px}
.end p{white-space:pre-line;line-height:1.9;margin:0}
.small{font-size:11px;color:var(--muted);text-align:center;margin-top:15px}
.hidden{display:none}
@media(min-width:540px){.hero{height:280px}.content{padding:26px}.story{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>MINI ROMANCE GAME</span><span>♡ FUJISAKI REN</span></div>
  <main class="card">
    <div class="hero"><div class="heroText"><div class="kicker">A STORY ON A RAINY NIGHT</div><h1>雨の日、ふたりきり</h1><div class="subtitle">雨が止むまで、あと少し。</div></div></div>
    <div class="content">
      <section id="start">
        <div class="char"><div class="avatar">蓮</div><div><div class="charName">藤崎 蓮　— Ren Fujisaki</div><div class="charDesc">28歳・同期 ／ クールで少し不器用</div></div></div>
        <p class="story">残業終わりの雨の夜。\nいつもそっけない同期と、思いがけずふたりきりに。</p>
        <button class="btn" id="begin">START　♡</button>
      </section>
      <section id="game" class="hidden">
        <div class="meter"><span>♡ 好感度</span><div class="meterTrack"><div class="meterFill" id="fill"></div></div><span id="score">0 / 6</span></div>
        <div class="storyLabel" id="chapter">第1話</div>
        <div class="story" id="text"></div>
        <div class="choices" id="choices"></div>
      </section>
      <section id="ending" class="hidden">
        <div class="storyLabel">ENDING</div>
        <div class="end"><h2 id="endTitle"></h2><p id="endText"></p></div>
        <div style="margin-top:17px"><button class="btn" id="again">もう一度プレイする ↻</button></div>
      </section>
    </div>
  </main>
  <p class="small">※これは短い試作版です。選択によってストーリーとエンディングが変わります。</p>
</div>
<script>
const scenes=[
 {chapter:"第1話：雨の残業",text:"22時。オフィスにはあなたと藤崎だけ。\\n窓の外は雨が降っている。\\n\\n「……まだいたんだ。もう帰る？」\\n彼はPCを閉じて、あなたを見た。",choices:[
  ["「もう少しで終わる！待っててくれる？」",2],
  ["「藤崎くんこそ、まだ帰らないの？」",1],
  ["「先に帰って大丈夫だよ！」",0]
 ]},
 {chapter:"第2話：駅までの道",text:"「……じゃあ、待ってる。」\\n\\n仕事を終えた2人は駅へ向かう。\\n彼は傘を開くと、あなたの方へ少し傾けた。\\n\\n「近くないと濡れるでしょ。」\\n肩が触れそうなくらい近い。",choices:[
  ["「ありがとう。藤崎くんって優しいね」",2],
  ["「傘、私が持とうか？」",1],
  ["何も言わず、少し距離をとる",0]
 ]},
 {chapter:"第3話：別れ際",text:"駅に着くと、彼は改札前で立ち止まった。\\n\\n「今日さ……」\\n少し言いにくそうに、あなたを見る。\\n\\n「一緒に帰れて、よかった。」\\nいつもより優しい声だった。",choices:[
  ["「私も。今度は晴れの日に帰ろうね」",2],
  ["「また明日ね！」と笑う",1],
  ["「じゃあ、お疲れさま！」と帰る",0]
 ]}
];
let stage=0,affection=0;
const $=id=>document.getElementById(id);
function begin(){stage=0;affection=0;$("start").classList.add("hidden");$("ending").classList.add("hidden");$("game").classList.remove("hidden");render()}
function render(){const s=scenes[stage];$("chapter").textContent=s.chapter;$("text").textContent=s.text;$("choices").innerHTML="";s.choices.forEach(([label,score])=>{const b=document.createElement("button");b.className="choice";b.textContent=label;b.onclick=()=>{affection+=score;stage++;if(stage>=scenes.length)showEnding();else render()};$("choices").appendChild(b)});$("score").textContent=affection+" / 6";$("fill").style.width=(affection/6*100)+"%"}
function showEnding(){$("game").classList.add("hidden");$("ending").classList.remove("hidden");if(affection>=5){$("endTitle").textContent="💕 Happy End『次は、デートとして』";$("endText").textContent="改札を通ったあと、スマホが震えた。\\n\\n藤崎：「今度、休みの日も会わない？……2人で。」\\n\\nどうやら、雨の日がきっかけで恋が始まったみたい。"}else if(affection>=2){$("endTitle").textContent="💙 Sweet End『もう少し、近づきたい』";$("endText").textContent="「また明日。」\\n\\n彼は改札を通る直前、振り返って笑った。少しずつ、2人の距離が縮まっていく予感。"}else{$("endTitle").textContent="🤍 Another End『いつもの同期』";$("endText").textContent="「じゃあ、また明日。」\\n\\nいつも通りの挨拶。でも、次に話すときは今日より少し意識してしまうかもしれない。"}}
$("begin").onclick=begin;$("again").onclick=begin;
</script>
</body>
</html>
